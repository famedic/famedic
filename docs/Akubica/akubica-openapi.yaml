openapi: 3.1.0

info:
  title: Famedic API — Integración Akubica
  version: 1.2.3
  description: |
    API REST `/api/v1` para el asistente virtual **Akubica / LeoV**.

    ## Autenticación

    - **Público:** `auth/*` OTP, `catalog/*`, `GET /secure-downloads/{token}`.
    - **Bearer Sanctum:** resto de endpoints (`Authorization: Bearer <token>`).
    - **Step-up (condicional):** descargas Bearer de resultados/facturas pueden exigir
      header `X-Step-Up-Grant: <grant_public_id>` cuando los flags de enforcement están ON.
    - **Secure download:** token opaco de 64 hex en el path. **No** es API key reutilizable.
      Tratar la URL como secreto temporal: HTTPS, no logs, no persistencia, consumo limitado.

    OTP de login/registro P0-A usa **SMS** (Vonage) cuando los flags están ON.
    Con flags OFF, login/register conservan el contrato legacy por email.

    Tokens Akubica: con `OTP_P0A_SANCTUM_3H_ENABLED=true`, `expires_in` ≈ 10800 (180 min).
    **No hay refresh token** — rehacer login OTP al expirar.

    ## Envelope

    Éxito: `{ "success": true, "data": {} }` — correlation solo en header `X-Correlation-ID`.
    Error: `{ "success": false, "error": { "code", "message", "fields?", "details?", "retryable", "correlation_id" } }`

    ## Correlation ID (P1-A6)

    Header opcional de request `X-Correlation-ID` (8–128, `[A-Za-z0-9._-]`).
    Si falta o es inválido, el servidor genera un UUID opaco.
    Respuesta: siempre `X-Correlation-ID`; en errores también `error.correlation_id` (mismo valor).

    ## Idempotency-Key (fase 1)

    Header opcional `Idempotency-Key` (8–128, `[A-Za-z0-9._-]`) en escrituras seleccionadas:
    `POST /auth/login/request-code`, `POST /auth/register`, `POST /checkout/payment-link`,
    `POST /laboratory-appointments`, `POST …/invoice-request`, `POST …/step-up/request`,
    `POST …/secure-link`.

    - Flag `API_V1_IDEMPOTENCY_ENABLED` (default OFF). Sin header o flag OFF → comportamiento previo.
    - Replay con mismo payload → mismo body/status + `Idempotency-Replayed: true` + `X-Correlation-ID` original.
    - Misma key, payload distinto → `409 IDEMPOTENCY_KEY_CONFLICT` (`retryable: false`).
    - Concurrente en `processing` → `409 IDEMPOTENCY_REQUEST_IN_PROGRESS` (`retryable: true`, `Retry-After`).
    - Lease vencido sin respuesta persistida → `409 IDEMPOTENCY_OPERATION_UNCERTAIN` (`retryable: false` para esa key).
    - **No** garantiza exactly-once si un efecto externo completó y el proceso murió antes de persistir la respuesta.

    ## Ownership

    Recursos ajenos → **404 soft-deny** (`ORDER_NOT_FOUND`, `INVOICE_NOT_FOUND`, …).
    Ítem de carrito ajeno → **403**.

    ## Cupones (contrato público)

    El contrato HTTP usa códigos **`COUPON_*`** (`COUPON_NOT_FOUND`, `COUPON_EXPIRED`,
    `COUPON_NOT_APPLICABLE`). La implementación interna puede referirse a “crédito” o
    saldo a favor; eso **no** cambia el vocabulario público ni las respuestas HTTP.

    ## Alcance de esta especificación

    - **61 operaciones** documentadas (núcleo, auxiliares y seguridad avanzada).
    - Incluye **secure links** y **descargas Bearer** (PDF) de resultados/facturas.
    - **No** incluye descarga XML en API V1 (no existe ruta `/api/v1` para XML).
    - Business Audit y el canal interno `web_checkout` **no** son endpoints públicos.

    ## Fuera de OpenAPI

    Mantenimiento `akubica:prune-otp` / `akubica:prune-idempotency` no es HTTP; ver runbooks.
    Auditoría de negocio (`business_audit_events`) es interna y no forma parte del contrato Leo.

    Documentación: `docs/Akubica/README.md`.
  contact:
    name: Famedic — Equipo de desarrollo
  license:
    name: Proprietary

servers:
  - url: https://staging.famedic.com.mx/api/v1
    description: Staging
  - url: https://famedic.com.mx/api/v1
    description: Producción
  - url: http://localhost:8080/api/v1
    description: Desarrollo local

tags:
  - name: Auth
    description: OTP SMS/legacy y tokens Bearer
  - name: SecureDownloads
    description: Descarga pública por token opaco
  - name: Catalog
    description: Catálogo laboratorio (público)
  - name: Cart
    description: Carrito y cupones
  - name: Checkout
    description: Prepare, draft y payment link
  - name: Appointments
    description: Citas de laboratorio
  - name: Orders
    description: Pedidos, resultados, facturas, step-up y descargas
  - name: User
    description: Perfil, contactos, direcciones, tax profiles

security: []

paths:
  /auth/login/request-code:
    post:
      tags: [Auth]
      operationId: authLoginRequestCode
      summary: Solicitar OTP de login
      description: |
        **P0-A ON:** body `{ "phone": "+52..." }` → `202` + `OtpChallenge` (SMS).
        Teléfono inexistente → misma forma `202` (señuelo; sin SMS).
        **Legacy OFF:** body `{ "email" }` → `200` genérico (anti-enumeración).
        Soporta `Idempotency-Key` opcional (fase 1) cuando el flag está ON.
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/LoginRequestCodeSms'
                - $ref: '#/components/schemas/LoginRequestCodeLegacy'
            examples:
              sms:
                value:
                  phone: '+520000000000'
              legacy:
                value:
                  email: usuario.ejemplo@example.com
      responses:
        '200':
          description: Legacy — solicitud procesada
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        '202':
          description: P0-A — challenge creado (o señuelo)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OtpChallenge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '503':
          $ref: '#/components/responses/DeliveryOrConfigFailed'

          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
  /auth/login/verify-code:
    post:
      tags: [Auth]
      operationId: authLoginVerifyCode
      summary: Verificar OTP de login y emitir token
      description: |
        **P0-A:** `{ "challenge_id", "code" }` → token + user.
        **Legacy:** `{ "email", "code" }`.
        `expires_in` refleja TTL efectivo (≈10800 s con Sanctum 3h ON).
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/LoginVerifyCodeSms'
                - $ref: '#/components/schemas/LoginVerifyCodeLegacy'
      responses:
        '200':
          description: Token emitido
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '422':
          $ref: '#/components/responses/OtpVerifyError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/DeliveryOrConfigFailed'

          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
  /auth/login/resend-code:
    post:
      tags: [Auth]
      operationId: authLoginResendCode
      summary: Reenviar OTP de login (P0-A)
      description: |
        Solo con login P0-A ON. Body `{ "challenge_id" }`.
        Con flags OFF → `503 FEATURE_DISABLED`.
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
      responses:
        '202':
          description: Challenge actualizado
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OtpChallenge'
        '422':
          $ref: '#/components/responses/OtpVerifyError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/FeatureDisabled'

          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
  /auth/register:
    post:
      tags: [Auth]
      operationId: authRegister
      summary: Iniciar registro (OTP)
      description: |
        **P0-A ON:** `email`, `phone`, `full_name` → `202` + challenge SMS (o señuelo si teléfono duplicado).
        **Legacy:** puede responder 409 email/phone ya registrados.
        Usuario se crea solo tras verify exitoso.
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Legacy — OTP iniciado
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        '202':
          description: P0-A — challenge
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OtpChallenge'
        '409':
          description: Legacy — email/teléfono ya registrados / IDEMPOTENCY_*
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/DeliveryOrConfigFailed'

          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
  /auth/register/verify-code:
    post:
      tags: [Auth]
      operationId: authRegisterVerifyCode
      summary: Verificar OTP de registro y emitir token
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RegisterVerifyCodeSms'
                - $ref: '#/components/schemas/RegisterVerifyCodeLegacy'
      responses:
        '200':
          description: Registro completado + token
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '409':
          description: LOGIN_REQUIRED u otros conflictos
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          $ref: '#/components/responses/OtpVerifyError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/DeliveryOrConfigFailed'

          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
  /auth/register/resend-code:
    post:
      tags: [Auth]
      operationId: authRegisterResendCode
      summary: Reenviar OTP de registro (P0-A)
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
      responses:
        '202':
          description: Challenge actualizado
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OtpChallenge'
        '422':
          $ref: '#/components/responses/OtpVerifyError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/FeatureDisabled'

          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
  /auth/token:
    delete:
      tags: [Auth]
      operationId: authRevokeToken
      summary: Revocar token Bearer actual (logout)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Token revocado
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
  /secure-downloads/{token}:
    get:
      tags: [SecureDownloads]
      operationId: secureDownloadShow
      summary: Descargar PDF mediante token opaco
      description: |
        **Sin Bearer.** Token de 64 hex. Secreto temporal.
        Las ligas nuevas se emiten con TTL contractual de 60 minutos y m?ximo 3 consumos autorizados.
        Errores: `SECURE_LINK_*`, `RESULT_NOT_READY`, `INVOICE_NOT_READY`, `FEATURE_DISABLED`.
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/SecureDownloadToken'
      responses:
        '200':
          description: PDF binario
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: SECURE_LINK_NOT_FOUND
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: RESULT_NOT_READY / INVOICE_NOT_READY
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '410':
          description: SECURE_LINK_EXPIRED / CONSUMED / REVOKED
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '503':
          $ref: '#/components/responses/FeatureDisabled'

          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
  /catalog/laboratory-brands:
    get:
      tags: [Catalog]
      operationId: catalogLaboratoryBrands
      summary: Listar marcas de laboratorio
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: state
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Marcas
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogLaboratoryBrandsResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /catalog/laboratory-tests:
    get:
      tags: [Catalog]
      operationId: catalogLaboratoryTests
      summary: Listar estudios
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: brand
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LaboratoryBrand'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: requires_appointment
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Lista paginada
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogLaboratoryTestsResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /catalog/laboratory-test-categories:
    get:
      tags: [Catalog]
      operationId: catalogLaboratoryTestCategories
      summary: Listar categorías
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: brand
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LaboratoryBrand'
      responses:
        '200':
          description: Categor?as
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogLaboratoryTestCategoriesResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /catalog/laboratory-stores:
    get:
      tags: [Catalog]
      operationId: catalogLaboratoryStores
      summary: Listar sucursales
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: brand
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LaboratoryBrand'
        - name: state
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Sucursales
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogLaboratoryStoresResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /catalog/laboratory-tests/{laboratory_test_id}:
    get:
      tags: [Catalog]
      operationId: catalogShowLaboratoryTest
      summary: Detalle de estudio
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/LaboratoryTestId'
      responses:
        '200':
          description: Estudio
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LaboratoryTest'
        '404':
          description: LAB_TEST_NOT_FOUND
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /catalog/medications/{medication_id}:
    get:
      tags: [Catalog]
      operationId: catalogShowMedication
      summary: Medicamento (deshabilitado)
      description: Responde `503 CATALOG_UNAVAILABLE` en el estado actual.
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/MedicationId'
      responses:
        '503':
          description: CATALOG_UNAVAILABLE
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /cart:
    get:
      tags: [Cart]
      operationId: cartIndex
      summary: Ver carrito
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/BrandRequired'
      responses:
        '200':
          description: Carrito
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    delete:
      tags: [Cart]
      operationId: cartClear
      summary: Vaciar carrito
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/BrandRequired'
      responses:
        '200':
          description: Carrito vaciado
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /cart/totals:
    get:
      tags: [Cart]
      operationId: cartTotals
      summary: Totales del carrito
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/BrandRequired'
      responses:
        '200':
          description: Totales
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /cart/items:
    post:
      tags: [Cart]
      operationId: cartItemsStore
      summary: Agregar ítem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [laboratory_test_id, brand]
              properties:
                laboratory_test_id:
                  type: integer
                brand:
                  $ref: '#/components/schemas/LaboratoryBrand'
      responses:
        '201':
          description: Ítem agregado
