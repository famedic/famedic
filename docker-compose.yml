# Famedic — Laravel 11 + Inertia/React + Vite
#
# Uso rápido:
#   1. Copia .env.example a .env y ajusta (ver bloque "Variables" abajo).
#   2. docker compose build
#   3. docker compose up -d
#   4. docker compose exec app php artisan key:generate
#   5. docker compose exec app php artisan migrate
#
# URLs:
#   - Aplicación: http://localhost:8080
#   - Vite (HMR): http://localhost:5173  (solo con perfil dev)
#
# Túnel Cloudflare automático (celular / otra red):
#   En .env:
#     COMPOSE_PROFILES=tunnel
#     TRUSTED_PROXIES=*
#     APP_URL_FROM_REQUEST=true
#   Luego: docker compose up -d --remove-orphans
#   URL pública: bash docker/tunnel-url.sh
#   (o: docker compose logs cloudflared | grep trycloudflare)
#
# Desarrollo con HMR (sin túnel): en .env pon COMPOSE_PROFILES=dev (o comenta tunnel)
#   docker compose up -d
#
# Recompilar assets para el túnel tras cambios en JS/CSS:
#   TUNNEL_REBUILD_ASSETS=true docker compose up -d tunnel-assets
#
# MySQL arranca con el stack. En .env usa DB_HOST=mysql (desde el contenedor app).
# Desde MySQL Workbench en tu PC: Host 127.0.0.1, Puerto 3306 (o MYSQL_PORT).
# SQLite: comenta el servicio mysql y pon DB_CONNECTION=sqlite si no quieres MySQL.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    networks:
      - famedic
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 180s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - famedic
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      # Variables solo para el contenedor MySQL (no usar DB_USERNAME=root aquí).
      MYSQL_DATABASE: "${MYSQL_DATABASE:-famedic}"
      MYSQL_USER: "${MYSQL_USER:-famedic}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-famedic}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - famedic
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Vite HMR: solo con perfil dev (COMPOSE_PROFILES=dev). No correr junto al túnel.
  node:
    image: node:20-bookworm
    profiles:
      - dev
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - .:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - famedic
    tty: true
    stdin_open: true

  # Prepara assets compilados y borra public/hot antes de abrir el túnel.
  tunnel-assets:
    image: node:20-bookworm
    profiles:
      - tunnel
    working_dir: /var/www/html
    environment:
      TUNNEL_REBUILD_ASSETS: "${TUNNEL_REBUILD_ASSETS:-false}"
    command: bash docker/tunnel-assets.sh
    volumes:
      - .:/var/www/html
    networks:
      - famedic

  # Quick Tunnel: no requiere cuenta ni instalar cloudflared en el host.
  # La URL cambia cada vez que el contenedor arranca.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    command: tunnel --no-autoupdate --url http://nginx:80
    networks:
      - famedic
    depends_on:
      nginx:
        condition: service_started
      tunnel-assets:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  famedic:
    driver: bridge
